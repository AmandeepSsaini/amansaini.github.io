# Writing dashboard for amansaini.dev/admin — https://github.com/sveltia/sveltia-cms
# Every publish commits a Markdown file to content/articles/ on master, which
# triggers .github/workflows/deploy.yml. Only GitHub users with write access to
# this repo can sign in and save.
backend:
  name: github
  repo: AmandeepSsaini/amansaini.github.io
  branch: master
  # The Cloudflare Worker running sveltia-cms-auth (GitHub OAuth).
  base_url: https://auth.amansaini.dev
  commit_messages:
    create: "Article: publish {{slug}}"
    update: "Article: update {{slug}}"
    delete: "Article: delete {{slug}}"
    uploadMedia: "Article: upload {{path}}"
    deleteMedia: "Article: delete {{path}}"

site_url: https://amansaini.dev
display_url: https://amansaini.dev/articles/

media_folder: public/images/articles
public_folder: /images/articles

collections:
  - name: articles
    label: Articles
    label_singular: Article
    folder: content/articles
    extension: md
    format: frontmatter
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{title}} — {{date}}"
    sortable_fields: [date, title]
    preview_path: "articles/{{slug}}/"
    fields:
      - { name: title, label: Title, widget: string }
      - { name: date, label: Publish date, widget: datetime }
      - { name: description, label: Summary, widget: text, hint: "One or two sentences. Shown on the index and in link previews." }
      - { name: tags, label: Tags, widget: list, required: false }
      - { name: cover, label: Cover image, widget: image, required: false }
      - { name: draft, label: Draft (hidden from the site), widget: boolean, default: false, required: false }
      - { name: body, label: Body, widget: markdown, hint: "Paste from Google Docs, Notion or anywhere — formatting is converted to Markdown and the site styles it." }
