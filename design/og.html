<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#07080A;--panel:#0E1116;--tx:#EDEFF2;--tx-2:#98A0AC;--tx-3:#5D6572;
  --ac:#5BFFA5;--ac-2:#6EE7FF;--hair:rgba(237,239,242,.055);--stroke:rgba(237,239,242,.16);--edge:rgba(237,239,242,.2)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:var(--bg);color:var(--tx);font-family:'Archivo',sans-serif;position:relative;
  padding:64px 68px;display:flex;flex-direction:column;justify-content:space-between}
.grid{position:absolute;inset:0;background-image:linear-gradient(var(--hair) 1px,transparent 1px),linear-gradient(90deg,var(--hair) 1px,transparent 1px);
  background-size:48px 48px;-webkit-mask-image:radial-gradient(ellipse 90% 90% at 70% 40%,#000 5%,transparent 75%)}
.glow{position:absolute;right:-140px;top:-120px;width:760px;height:760px;border-radius:50%;
  background:radial-gradient(circle,rgba(91,255,165,.13),transparent 62%)}
.top,.mid,.bot{position:relative;z-index:2}
.dom{font-family:'JetBrains Mono',monospace;font-size:17px;letter-spacing:.2em;text-transform:uppercase;color:var(--ac)}
h1{font-weight:900;font-size:78px;line-height:.92;letter-spacing:-.04em;text-transform:uppercase;margin-top:6px}
.role{font-family:'JetBrains Mono',monospace;font-size:19px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ac);margin-top:22px;display:flex;align-items:center;gap:13px}
.role i{width:9px;height:9px;border-radius:50%;background:var(--ac);box-shadow:0 0 12px var(--ac)}
.what{font-size:23px;line-height:1.45;color:var(--tx-2);margin-top:26px;max-width:22ch}
.what b{color:var(--tx);font-weight:600}
.bot{display:flex;justify-content:space-between;align-items:flex-end;
  border-top:1px solid var(--stroke);padding-top:20px;
  font-family:'JetBrains Mono',monospace;font-size:14px;letter-spacing:.13em;text-transform:uppercase;color:var(--tx-3)}
svg.sys{position:absolute;right:56px;top:196px;z-index:2}
.bx{fill:var(--panel);stroke:var(--stroke);stroke-width:1.3}
.bx.hot{stroke:var(--ac);stroke-width:2;fill:rgba(91,255,165,.06)}
.t{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;fill:var(--tx);text-transform:uppercase}
.t.hot{fill:var(--ac)}
.ln{stroke:var(--edge);stroke-width:1.4;fill:none}
.ln.hot{stroke:var(--ac);stroke-width:1.7;opacity:.9}
.pk{fill:var(--ac)}
</style></head>
<body>
<div class="grid"></div><div class="glow"></div>
<div class="top"><div class="dom">amansaini.dev</div>
  <h1>Amandeep<br>Singh Saini</h1>
  <div class="role"><i></i>Senior / Staff Engineer · Senior AI Engineer</div>
</div>
<div class="mid"><div class="what">I design and orchestrate <b>multi-agent AI systems</b> — agent runtimes, MCP tool servers and RAG pipelines.</div></div>
<div class="bot"><span>10+ Yrs · Python · TypeScript · React · Vue 3 · Kubernetes</span><span>Phoenix, AZ</span></div>

<svg class="sys" width="330" height="250" viewBox="0 0 330 250" id="s"></svg>
<script>
const N=[{x:6,y:100,w:86,h:48,t:'REQUEST'},{x:120,y:96,w:98,h:56,t:'ORCH',hot:1},
         {x:244,y:16,w:82,h:44,t:'MCP'},{x:244,y:100,w:82,h:44,t:'RAG'},{x:244,y:184,w:82,h:44,t:'LLM'}];
const E=[[0,1,1],[1,2,1],[1,3,1],[1,4,0]];
let o='<defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="var(--edge)"/></marker><marker id="ah" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="var(--ac)"/></marker></defs>';
E.forEach(([a,b,h])=>{const A=N[a],B=N[b];
  const x1=A.x+A.w,y1=A.y+A.h/2,x2=B.x-7,y2=B.y+B.h/2,m=(x1+x2)/2;
  o+=`<path class="ln${h?' hot':''}" d="M${x1},${y1} C${m},${y1} ${m},${y2} ${x2},${y2}" marker-end="url(#${h?'ah':'a'})"/>`;
  if(h)o+=`<circle class="pk" cx="${x1+(x2-x1)*.55}" cy="${y1+(y2-y1)*.55}" r="3.2"/>`;});
N.forEach(n=>{o+=`<rect class="bx${n.hot?' hot':''}" x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="4"/>
  <text class="t${n.hot?' hot':''}" x="${n.x+n.w/2}" y="${n.y+n.h/2+4}" text-anchor="middle">${n.t}</text>`;});
document.getElementById('s').innerHTML=o;
</script></body></html>
